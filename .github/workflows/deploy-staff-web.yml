name: Deploy Staff Web to Cloud Run

on:
  workflow_run:
    workflows: ["Staff web CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: staff-web-cloud-run
  cancel-in-progress: false

env:
  PROJECT: finance-ai-api
  REGION: southamerica-east1
  SERVICE: finance-staff-web
  SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.id == github.event.repository.id))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staff-web-production
    env:
      STAFF_RUNTIME_SERVICE_ACCOUNT: finance-staff-web-runtime@finance-ai-api.iam.gserviceaccount.com

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: staff-web/.nvmrc
          cache: npm
          cache-dependency-path: staff-web/package-lock.json
      - name: Lint, type-check, test and build
        working-directory: staff-web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npx playwright install --with-deps chromium
      - name: Build the Staff Web image
        run: |
          image="$REGION-docker.pkg.dev/$PROJECT/finance-ai/staff-web:$SOURCE_SHA"
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --tag "$image" staff-web
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/1006444199777/locations/global/workloadIdentityPools/github-staff-web/providers/github
          service_account: finance-staff-web-deploy@finance-ai-api.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Check Staff API compatibility before publishing
        run: |
          service=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json)
          origin=$(jq -er '.status.url' <<< "$service")
          host=$(jq -er '.spec.template.spec.containers[0].env[] | select(.name == "STAFF_API_HOST") | .value' <<< "$service")
          [[ "$host" =~ ^[a-z0-9.-]+\.run\.app$ ]]
          bash staff-web/deploy/verify-staff-api.sh "https://$host" "$origin"
          echo "STAFF_ORIGIN=$origin" >> "$GITHUB_ENV"
      - name: Publish the image and deploy its digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$SOURCE_SHA" == "$main_sha" ]]
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker push "$IMAGE"
          digest=$(gcloud artifacts docker images describe "$IMAGE" --project "$PROJECT" --format='value(image_summary.digest)')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          deployed_image="${IMAGE%:*}@$digest"
          echo "DEPLOYED_IMAGE=$deployed_image" >> "$GITHUB_ENV"
          gcloud run services update "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --image "$deployed_image" --service-account "$STAFF_RUNTIME_SERVICE_ACCOUNT" --async --quiet
      - name: Verify the deployed URL and browser
        run: |
          for attempt in {1..36}; do
            service=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json)
            if jq -e --arg image "$DEPLOYED_IMAGE" '
              .metadata.generation == .status.observedGeneration and
              .spec.template.spec.containers[0].image == $image and
              .status.latestCreatedRevisionName == .status.latestReadyRevisionName and
              any(.status.conditions[]; .type == "Ready" and .status == "True")
            ' <<< "$service" >/dev/null; then
              break
            fi
            if (( attempt == 36 )); then
              echo "::error::The new Staff Web revision did not become ready."
              exit 1
            fi
            sleep 5
          done
          url=$(jq -er '.status.url' <<< "$service")
          test "$url" = "$STAFF_ORIGIN"
          test "$(curl --fail --silent --show-error --max-time 20 "$url/health")" = ok
          bash staff-web/deploy/verify-staff-api.sh "$url" "$url"
          node staff-web/deploy/verify-browser.mjs "$url"
          echo "Staff Web URL: $url" >> "$GITHUB_STEP_SUMMARY"
