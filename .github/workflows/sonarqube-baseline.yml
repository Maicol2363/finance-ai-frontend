name: SonarQube frontend baseline

on:
  push:
    branches: [codex/sonarqube-frontend-baseline]

permissions:
  contents: read

jobs:
  publish:
    name: Publish coverage for the frontend main commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 9e31c6d50018ee524a244e2e69ff7498a7a7d53d # main at the start of this coverage run
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Flutter 3.47.2
        shell: bash
        run: |
          archive="$RUNNER_TEMP/flutter_linux_3.47.2-stable.tar.xz"
          curl --fail --silent --show-error --location \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.2-stable.tar.xz" \
            --output "$archive"
          echo "447878859d01ca9bfdb99a85f245af07ed8a15fedcd9d189c4749e8e92d1f185  $archive" | sha256sum --check
          tar --extract --xz --file "$archive" --directory "$RUNNER_TEMP"
          rm --force "$archive"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve locked dependencies
        run: |
          flutter config --no-analytics
          flutter pub get --enforce-lockfile
      - name: Format and analyze
        run: |
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze
      - name: Test and enforce coverage
        shell: bash
        run: |
          flutter test --coverage
          awk -F: '
            /^LF:/{found += $2}
            /^LH:/{hit += $2}
            END {
              coverage = found == 0 ? 0 : (100 * hit / found)
              printf "Flutter line coverage: %.2f%%\n", coverage
              if (coverage < 80) exit 1
            }
          ' coverage/lcov.info
      - name: Publish coverage to SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=Maicol2363_finance-ai-frontend
            -Dsonar.organization=maicol2363
            -Dsonar.sources=lib
            -Dsonar.tests=test,integration_test
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info
            -Dsonar.branch.name=main
            -Dsonar.scm.revision=9e31c6d50018ee524a244e2e69ff7498a7a7d53d
