name: Release Android integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Backend branch, tag, or commit to validate with this frontend build
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: release-android-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-release-integration:
    name: Android release journeys against disposable API
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.ref == 'develop' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check out backend release candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Maicol2363/finance-ai-backend
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.backend_ref || 'main' }}
          path: finance-ai-backend
          persist-credentials: false

      - name: Record backend revision under test
        shell: bash
        run: |
          echo "Backend revision: $(git -C finance-ai-backend rev-parse HEAD)"

      - name: Install checksum-verified Flutter 3.47.2
        shell: bash
        run: |
          archive="$RUNNER_TEMP/flutter_linux_3.47.2-stable.tar.xz"
          curl --fail --silent --show-error --location \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.2-stable.tar.xz" \
            --output "$archive"
          echo "447878859d01ca9bfdb99a85f245af07ed8a15fedcd9d189c4749e8e92d1f185  $archive" | sha256sum --check
          tar --extract --xz --file "$archive" --directory "$RUNNER_TEMP"
          rm --force "$archive"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Resolve locked Flutter dependencies
        run: |
          flutter config --no-analytics
          flutter pub get --enforce-lockfile

      - name: Start disposable backend and PostgreSQL
        env:
          POSTGRES_DB: finance_ai_ci
          POSTGRES_USER: finance_ai
          POSTGRES_PASSWORD: change-me-ci
          FINANCE_AI_GEMINI_API_KEY: ''
          FINANCE_AI_DEEPSEEK_API_KEY: ''
        run: docker compose -f finance-ai-backend/compose.yaml up --build -d database api

      - name: Wait for local API readiness
        run: curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:8000/health/ready

      - name: Run authentication and financial journeys on Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/run-release-android-journeys.sh

      - name: Stop disposable backend and remove database volume
        if: always()
        continue-on-error: true
        run: docker compose -f finance-ai-backend/compose.yaml down --volumes --remove-orphans
