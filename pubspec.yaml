name: finance_ai
description: Manual-first personal budgeting application.
publish_to: "none"
version: 0.8.0+8

environment:
  sdk: ">=3.13.2 <3.14.0"

dependencies:
  camera: ^0.12.1
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.2
  flutter_secure_storage: 11.0.0
  go_router: 18.0.0
  http: 1.6.0
  image_picker: ^1.2.3
  lucide_icons_flutter: ^3.1.25
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/finance-ai-app-icon.png
    - assets/licenses/lucide-LICENSE.txt
